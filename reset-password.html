<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clashe | Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="js/pwa-capture.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/loader.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/Lightmode_logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/pwa-192.png" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clashe" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/reset-password.css" />
  </head>
  <body data-page="reset-password" class="reset-page">
    <main class="reset-main">
      <section class="reset-card">
        <div class="reset-logo" aria-hidden="true">
          <img src="assets/Lightmode_logo.svg" alt="Clashe" class="theme-logo theme-logo--light" />
          <img src="assets/Darkmode_logo.svg" alt="Clashe" class="theme-logo theme-logo--dark" />
        </div>
        <p class="reset-eyebrow">Account security</p>
        <h1 class="reset-title">Set a new password</h1>
        <p class="reset-copy">Use at least 6 characters. Keep it unique and not reused on other accounts.</p>

        <form id="reset-form" class="reset-form" novalidate>
          <label class="field-label" for="reset-password">New password</label>
          <div class="reset-password-field">
            <input id="reset-password" name="password" type="password" autocomplete="new-password" required />
            <button
              class="reset-password-toggle"
              type="button"
              data-toggle-password="reset-password"
              aria-label="Show password"
            >
              <i class="app-icon fa-solid fa-eye reset-password-toggle__icon reset-password-toggle__icon--show" aria-hidden="true"></i>
              <i class="app-icon fa-solid fa-eye-slash reset-password-toggle__icon reset-password-toggle__icon--hide" aria-hidden="true"></i>
            </button>
          </div>

          <label class="field-label" for="reset-confirm-password">Confirm new password</label>
          <div class="reset-password-field">
            <input
              id="reset-confirm-password"
              name="confirm_password"
              type="password"
              autocomplete="new-password"
              required
            />
            <button
              class="reset-password-toggle"
              type="button"
              data-toggle-password="reset-confirm-password"
              aria-label="Show confirmed password"
            >
              <i class="app-icon fa-solid fa-eye reset-password-toggle__icon reset-password-toggle__icon--show" aria-hidden="true"></i>
              <i class="app-icon fa-solid fa-eye-slash reset-password-toggle__icon reset-password-toggle__icon--hide" aria-hidden="true"></i>
            </button>
          </div>

          <p id="reset-status" class="status-message" hidden></p>

          <button id="reset-submit" class="btn btn--primary btn--block" type="submit">Update password</button>
          <a class="reset-back" href="auth.html">Back to login</a>
        </form>
      </section>
    </main>

    <footer class="app-legal-footer" aria-label="Legal links">
      <a href="terms.html">Terms of Service</a>
      <span aria-hidden="true">•</span>
      <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="js/ux-animations.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/env.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/pages/reset-password.js"></script>
  </body>
</html>
